<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remy</title>
<style>
:root{--bg:#FAF9F7;--fg:#1f1b18;--dim:#6b625b;--accent:#B5532F;--line:#e6dfd8}
@media (prefers-color-scheme:dark){:root{--bg:#0B0A09;--fg:#f1ebe5;--dim:#a89d94;--accent:#E08A62;--line:#2a2623}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:2rem;line-height:1.2;margin:0 0 .25rem}
h2{font-size:1.25rem;margin:2.2rem 0 .5rem}
p,li{margin:.6rem 0}
ul{padding-left:1.2rem}
a{color:var(--accent)}
.meta{color:var(--dim);margin:0 0 1.5rem}
table{border-collapse:collapse;width:100%;margin:1rem 0;font-size:.95rem}
th,td{border:1px solid var(--line);padding:.55rem .65rem;text-align:left;vertical-align:top}
th{background:rgba(127,127,127,.08)}
footer{margin-top:3rem;color:var(--dim);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Remy</h1>
<p class="meta">Remember what matters.</p>
<ul>
<li><a href="privacy.html">Privacy Policy</a></li>
<li><a href="terms.html">Terms of Use</a></li>
<li>Support: <a href="mailto:remyinderapp.support@gmail.com">remyinderapp.support@gmail.com</a></li>
</ul>
</main>
</body>
</html>
